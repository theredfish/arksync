<svg width="720" height="864" viewBox="0 0 720 864" role="img" aria-labelledby="diagram-title diagram-desc" xmlns="http://www.w3.org/2000/svg">
<title id="diagram-title">EventRouter and Knot/Hub communication boundaries</title>
<desc id="diagram-desc">Each runtime routes events locally. Protocol sessions communicate bidirectionally through MessageLink endpoints, over local Tokio channels or future remote transport adapters.</desc>
<style>
svg { font-family: var(--font-sans, system-ui, sans-serif); }
.panel { fill: var(--card, #1e2933); stroke: var(--border, #405969); stroke-width: 1; }
.box { fill: var(--secondary, #2d4354); stroke: var(--border, #405969); stroke-width: 1.3; }
.router { fill: var(--accent-surface, #365267); stroke: var(--primary, #4ad2db); stroke-width: 1.6; }
.label { fill: var(--foreground, #f5f6fb); font-size: 14px; font-weight: 600; }
.small { fill: var(--muted-foreground, #a0a7b0); font-size: 12px; }
.group { fill: var(--foreground, #f5f6fb); font-size: 14px; font-weight: 650; }
.caption { fill: var(--muted-foreground, #a0a7b0); font-size: 11px; }
.edge { fill: none; stroke: var(--muted-foreground, #a0a7b0); stroke-width: 1.5; }
.arrow { fill: var(--muted-foreground, #a0a7b0); }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10z" class="arrow"/>
</marker>
