<text x="179.0" y="91.0" text-anchor="middle" class="label">EventRouter</text>
<text x="179.0" y="111.0" text-anchor="middle" class="small">Internal hardware events</text>
<rect x="32" y="174" width="294" height="84" rx="10" class="box"/>
<text x="179.0" y="201.0" text-anchor="middle" class="label">Runtime adapter</text>
<text x="179.0" y="221.0" text-anchor="middle" class="small">Handlers, mapper,</text>
<text x="179.0" y="241.0" text-anchor="middle" class="small">protocol session + outbox</text>
<rect x="32" y="306" width="294" height="68" rx="10" class="router"/>
<text x="179.0" y="335.0" text-anchor="middle" class="label">EventRouter</text>
<text x="179.0" y="355.0" text-anchor="middle" class="small">Accepted inbound protocol messages</text>
<rect x="32" y="426" width="294" height="52" rx="10" class="box"/>
<text x="179.0" y="457.0" text-anchor="middle" class="label">Local subscribers</text>
<rect x="394" y="174" width="294" height="84" rx="10" class="box"/>
<text x="541.0" y="201.0" text-anchor="middle" class="label">Runtime adapter</text>
<text x="541.0" y="221.0" text-anchor="middle" class="small">Protocol session +</text>
<text x="541.0" y="241.0" text-anchor="middle" class="small">transactional handlers</text>
<rect x="394" y="306" width="294" height="68" rx="10" class="router"/>
<text x="541.0" y="335.0" text-anchor="middle" class="label">EventRouter</text>
<text x="541.0" y="355.0" text-anchor="middle" class="small">Accepted messages / committed events</text>
<rect x="394" y="426" width="294" height="52" rx="10" class="box"/>
<text x="541.0" y="457.0" text-anchor="middle" class="label">Hub application / subscribers</text>
<text x="541" y="88" text-anchor="middle" class="small">Use cases, transactions and responses</text>
<text x="541" y="110" text-anchor="middle" class="small">remain inside the Hub boundary.</text>
