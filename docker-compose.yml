services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: arksync-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: arksync
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_partman_bgw
      - -c
      - pg_partman_bgw.dbname=arksync
      - -c
      - pg_partman_bgw.interval=3600
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d arksync"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  grafana:
    image: grafana/grafana-enterprise:12.3.0-18209090404-boringcrypto
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-33000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
    postgres-data:
    grafana-data:
