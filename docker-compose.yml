services:
  postgres:
    build:
      context: docker/postgres
      dockerfile: Dockerfile
    container_name: arksync-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: arksync
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_partman_bgw
      - -c
      - pg_partman_bgw.dbname=arksync
      - -c
      - pg_partman_bgw.interval=3600
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d arksync"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  grafana:
    image: grafana/grafana-enterprise:12.3.0-18209090404-boringcrypto
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-33000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

  prisma-studio:
    build:
      context: docker/prisma-studio
      dockerfile: Dockerfile
    container_name: arksync-prisma-studio
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "127.0.0.1:${PRISMA_STUDIO_PORT:-5555}:5555"
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/arksync
    depends_on:
      postgres:
        condition: service_healthy

volumes:
    postgres-data:
    grafana-data:
